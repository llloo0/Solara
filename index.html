<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Solara</title>
    <meta name="apple-mobile-web-app-title" content="Solara">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/i18n.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script>
        (function () {
            const ua = navigator.userAgent || "";
            const mobile = /android|iphone|ipad|ipod|mobile|blackberry|phone|opera mini|windows phone/i.test(ua) ||
                (window.matchMedia && window.matchMedia("(max-width: 820px)").matches);
            window.__SOLARA_IS_MOBILE = Boolean(mobile);
            document.documentElement.classList.add(mobile ? "mobile-view" : "desktop-view");
        })();
    </script>
</head>
<body>
    <div class="background-stage" id="backgroundStage" aria-hidden="true">
        <div class="background-stage__layer background-stage__layer--base" id="backgroundBaseLayer"></div>
        <div class="background-stage__layer background-stage__layer--transition" id="backgroundTransitionLayer"></div>
    </div>

    <div class="container" id="mainContainer">
        <div class="mobile-toolbar" id="mobileToolbar" role="toolbar">
            <button class="icon-button" id="mobileSearchToggle" type="button" aria-label="打开搜索" title="搜索">
                <i class="fas fa-search" aria-hidden="true"></i>
            </button>
            <div class="mobile-toolbar__title" id="mobileToolbarTitle">Solara</div>
            <button class="icon-button" id="mobileQueueToggle" type="button" aria-label="打开播放队列" title="播放队列">
                <i class="fas fa-bars-staggered" aria-hidden="true"></i>
            </button>
        </div>

        <header class="header">
            <div class="brand-lockup">
                <div class="brand-mark" aria-hidden="true">S</div>
                <div>
                    <h1>Solara</h1>
                    <p>让下一首歌更容易被找到</p>
                </div>
            </div>
            <div class="header-actions">
                <span class="header-note">PERSONAL MUSIC DESK</span>
                <button id="themeToggleButton" class="icon-button" type="button" aria-label="切换深浅色模式" title="切换深浅色模式">
                    <i class="fas fa-sun theme-icon theme-icon--sun" aria-hidden="true"></i>
                    <i class="fas fa-moon theme-icon theme-icon--moon" aria-hidden="true"></i>
                </button>
            </div>
        </header>

        <section class="search-area" id="searchArea" aria-label="搜索音乐">
            <button type="button" class="search-expand-btn" id="searchExpandBtn" aria-expanded="false" aria-controls="searchControls">
                <i class="fas fa-magnifying-glass" aria-hidden="true"></i>
                <span>搜索音乐</span>
                <i class="fas fa-arrow-right" aria-hidden="true"></i>
            </button>
            <div class="search-heading">
                <div>
                    <span class="eyebrow">FIND YOUR NEXT TRACK</span>
                    <h2>搜索、试听、加入队列。</h2>
                </div>
                <button type="button" class="icon-button mobile-close-btn" id="mobileSearchClose" aria-label="关闭搜索" title="关闭搜索">
                    <i class="fas fa-times" aria-hidden="true"></i>
                </button>
            </div>
            <div class="search-controls-wrapper" id="searchControls">
                <div class="search-bar-unified">
                    <div class="search-input-wrapper">
                        <i class="fas fa-magnifying-glass search-icon" aria-hidden="true"></i>
                        <input type="text" id="searchInput" class="search-input" placeholder="搜索歌曲、歌手或专辑..." autocomplete="off">
                    </div>
                    <div class="source-select-wrapper" id="sourceSelectWrapper">
                        <button id="sourceSelectButton" class="source-select-btn" type="button" aria-haspopup="listbox" aria-expanded="false">
                            <span id="sourceSelectLabel">网易云音乐</span>
                            <i class="fas fa-chevron-down caret-icon" aria-hidden="true"></i>
                        </button>
                        <div id="sourceMenu" class="source-menu" role="listbox" aria-labelledby="sourceSelectButton"></div>
                    </div>
                </div>
                <button id="searchBtn" class="search-btn" type="button">
                    <i class="fas fa-arrow-right" aria-hidden="true"></i>
                    <span>开始搜索</span>
                </button>
            </div>
            <div class="search-meta">
                <span>从多个音源查找歌曲</span>
                <div class="search-results-toolbar">
                    <div class="import-dropdown">
                        <button class="import-selected-btn" id="importSelectedBtn" type="button" disabled>
                            <i class="fas fa-layer-group" aria-hidden="true"></i>
                            <span>导入已选</span>
                            <span id="importSelectedCount" class="import-selected-count"></span>
                            <i class="fas fa-chevron-down import-dropdown-caret" aria-hidden="true"></i>
                        </button>
                        <div class="import-dropdown-menu" id="importSelectedMenu" hidden>
                            <button class="import-dropdown-item" id="importToPlaylist" data-action="playlist" type="button">导入到播放列表</button>
                            <button class="import-dropdown-item" id="importToFavorites" data-action="favorites" type="button">导入到收藏列表</button>
                        </div>
                    </div>
                </div>
            </div>
            <div id="searchResults" class="search-results">
                <div class="search-results-list" id="searchResultsList"></div>
            </div>
        </section>

        <main class="main-content">
            <section class="cover-area" aria-label="当前播放">
                <div class="cover-topline">
                    <span class="eyebrow">NOW PLAYING</span>
                    <span class="playing-indicator"><i class="fas fa-wave-square" aria-hidden="true"></i> LIVE QUEUE</span>
                </div>
                <div class="album-stage">
                    <div class="album-shadow" aria-hidden="true"></div>
                    <div class="album-cover" id="albumCover">
                        <div class="placeholder">
                            <i class="fas fa-music" aria-hidden="true"></i>
                        </div>
                    </div>
                </div>
                <div class="mobile-inline-lyrics" id="mobileInlineLyrics" aria-hidden="true">
                    <div class="mobile-inline-lyrics__hint"><i class="fas fa-arrow-left" aria-hidden="true"></i>轻触返回封面</div>
                    <div class="mobile-inline-lyrics__scroll" id="mobileInlineLyricsScroll">
                        <div class="mobile-inline-lyrics__content" id="mobileInlineLyricsContent"></div>
                    </div>
                </div>
                <div class="current-song-info">
                    <div class="current-song-title-row">
                        <div>
                            <span class="track-label">SELECTED TRACK</span>
                            <div class="current-song-title" id="currentSongTitle">选择一首歌曲开始播放</div>
                        </div>
                        <button class="favorite-toggle current-favorite-btn icon-button" id="currentFavoriteToggle" type="button" aria-label="收藏当前歌曲" title="收藏当前歌曲">
                            <i class="far fa-heart" aria-hidden="true"></i>
                        </button>
                    </div>
                    <div class="current-song-artist" id="currentSongArtist">未知艺术家</div>
                    <button class="mobile-quality-chip" id="mobileQualityToggle" type="button" aria-haspopup="menu" aria-expanded="false">
                        <span id="mobileQualityLabel">极高音质</span>
                        <i class="fas fa-chevron-down" aria-hidden="true"></i>
                    </button>
                </div>
            </section>

            <section class="lyrics empty" id="lyrics" data-placeholder="default" aria-label="歌词">
                <div class="panel-heading">
                    <div>
                        <span class="eyebrow">LIVE LYRICS</span>
                        <h2>跟着这一句走</h2>
                    </div>
                    <i class="fas fa-quote-left panel-symbol" aria-hidden="true"></i>
                </div>
                <div class="lyrics-scroll" id="lyricsScroll">
                    <div class="lyrics-content" id="lyricsContent"></div>
                </div>
            </section>

            <div class="mobile-panel" id="mobilePanel">
                <div class="mobile-panel-header" id="mobilePanelHeader">
                    <div class="mobile-panel-handle" aria-hidden="true"></div>
                    <div class="panel-heading panel-heading--mobile">
                        <div>
                            <span class="eyebrow">YOUR LIBRARY</span>
                            <h2 id="mobilePanelTitle">播放队列</h2>
                        </div>
                    </div>
                    <div class="mobile-panel-actions">
                        <div class="mobile-actions-group" id="mobilePlaylistActions" role="group" aria-label="播放列表操作">
                            <button id="mobileImportPlaylistBtn" class="icon-button" type="button" aria-label="导入播放列表" title="导入播放列表"><i class="fas fa-file-import" aria-hidden="true"></i></button>
                            <button id="mobileExportPlaylistBtn" class="icon-button" type="button" aria-label="导出播放列表" title="导出播放列表" disabled><i class="fas fa-file-export" aria-hidden="true"></i></button>
                            <button id="mobileClearPlaylistBtn" class="icon-button danger-button" type="button" aria-label="清空播放列表" title="清空播放列表" hidden><i class="fas fa-trash" aria-hidden="true"></i></button>
                        </div>
                        <div class="mobile-actions-group" id="mobileFavoritesActions" role="group" aria-label="收藏列表操作" hidden>
                            <button id="mobileAddAllFavoritesBtn" class="icon-button" type="button" aria-label="全部添加到播放列表" title="全部添加到播放列表"><i class="fas fa-plus" aria-hidden="true"></i></button>
                            <button id="mobileImportFavoritesBtn" class="icon-button" type="button" aria-label="导入收藏列表" title="导入收藏列表"><i class="fas fa-file-import" aria-hidden="true"></i></button>
                            <button id="mobileExportFavoritesBtn" class="icon-button" type="button" aria-label="导出收藏列表" title="导出收藏列表" disabled><i class="fas fa-file-export" aria-hidden="true"></i></button>
                            <button id="mobileClearFavoritesBtn" class="icon-button danger-button" type="button" aria-label="清空收藏列表" title="清空收藏列表"><i class="fas fa-trash" aria-hidden="true"></i></button>
                        </div>
                        <button id="mobilePanelClose" class="icon-button" type="button" aria-label="收起播放队列" title="收起播放队列"><i class="fas fa-chevron-down" aria-hidden="true"></i></button>
                    </div>
                </div>

                <div class="library-panel playlist active empty" id="playlist" role="tabpanel" aria-labelledby="playlistTab">
                    <div class="playlist-header">
                        <div class="playlist-tabs" role="tablist">
                            <button id="playlistTab" class="playlist-tab active" type="button" role="tab" aria-selected="true" data-target="playlist">播放队列</button>
                            <button id="favoritesTab" class="playlist-tab" type="button" role="tab" aria-selected="false" data-target="favorites">收藏</button>
                        </div>
                        <div class="playlist-actions-tray" role="group" aria-label="播放列表操作">
                            <input id="importPlaylistInput" class="playlist-import-input" type="file" accept="application/json" hidden>
                            <button class="playlist-action-btn" id="importPlaylistBtn" type="button" title="导入播放列表" aria-label="导入播放列表"><i class="fas fa-file-import" aria-hidden="true"></i></button>
                            <button class="playlist-action-btn" id="exportPlaylistBtn" type="button" title="导出播放列表" aria-label="导出播放列表"><i class="fas fa-file-export" aria-hidden="true"></i></button>
                            <button class="playlist-action-btn danger-button" id="clearPlaylistBtn" type="button" title="清空播放列表" aria-label="清空播放列表"><i class="fas fa-trash" aria-hidden="true"></i></button>
                        </div>
                    </div>
                    <div class="playlist-scroll"><div class="playlist-items" id="playlistItems"></div></div>
                </div>

                <div class="library-panel playlist favorites empty" id="favorites" role="tabpanel" aria-labelledby="favoritesTab" hidden>
                    <div class="playlist-header">
                        <div class="playlist-tabs" role="tablist">
                            <button class="playlist-tab" type="button" role="tab" aria-selected="false" data-target="playlist">播放队列</button>
                            <button class="playlist-tab active" type="button" role="tab" aria-selected="true" data-target="favorites">收藏</button>
                        </div>
                        <div class="playlist-actions-tray" role="group" aria-label="收藏列表操作">
                            <button class="playlist-action-btn" id="addAllFavoritesBtn" type="button" title="全部添加到播放列表" aria-label="全部添加到播放列表"><i class="fas fa-plus" aria-hidden="true"></i></button>
                            <input id="importFavoritesInput" class="playlist-import-input" type="file" accept="application/json" hidden>
                            <button class="playlist-action-btn" id="importFavoritesBtn" type="button" title="导入收藏列表" aria-label="导入收藏列表"><i class="fas fa-file-import" aria-hidden="true"></i></button>
                            <button class="playlist-action-btn" id="exportFavoritesBtn" type="button" title="导出收藏列表" aria-label="导出收藏列表"><i class="fas fa-file-export" aria-hidden="true"></i></button>
                            <button class="playlist-action-btn danger-button" id="clearFavoritesBtn" type="button" title="清空收藏列表" aria-label="清空收藏列表"><i class="fas fa-trash" aria-hidden="true"></i></button>
                        </div>
                    </div>
                    <div class="playlist-scroll"><div class="playlist-items" id="favoriteItems"></div></div>
                </div>
            </div>
        </main>

        <footer class="controls">
            <div class="transport-controls">
                <button class="transport-button" id="playModeBtn" type="button" title="播放模式" aria-label="播放模式"><i class="fas fa-repeat" aria-hidden="true"></i></button>
                <button class="transport-button" onclick="playPrevious()" type="button" title="上一曲" aria-label="上一曲"><i class="fas fa-backward-step" aria-hidden="true"></i></button>
                <button class="transport-button transport-button--play" id="playPauseBtn" type="button" title="播放 / 暂停" aria-label="播放 / 暂停"><i class="fas fa-play" aria-hidden="true"></i></button>
                <button class="transport-button" onclick="playNext()" type="button" title="下一曲" aria-label="下一曲"><i class="fas fa-forward-step" aria-hidden="true"></i></button>
                <button class="transport-button" id="shuffleToggleBtn" type="button" title="随机播放" aria-label="切换随机播放"><i class="fas fa-shuffle shuffle-icon shuffle-icon--off" aria-hidden="true"></i></button>
            </div>
            <div class="progress-container">
                <span id="currentTimeDisplay">00:00</span>
                <input type="range" id="progressBar" min="0" max="0" step="0.1" value="0" aria-label="播放进度">
                <span id="durationDisplay">00:00</span>
            </div>
            <div class="control-trailing">
                <div class="audio-tools">
                    <div class="player-quality">
                        <button id="qualityToggle" class="player-quality-btn" type="button" aria-haspopup="menu" aria-expanded="false">
                            <span id="qualityLabel">极高音质</span>
                            <i class="fas fa-sliders" aria-hidden="true"></i>
                        </button>
                        <div id="playerQualityMenu" class="player-quality-menu"></div>
                    </div>
                    <div class="volume-container">
                        <i id="volumeIcon" class="fas fa-volume-high" aria-hidden="true"></i>
                        <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="0.8" aria-label="音量">
                    </div>
                </div>
            </div>
        </footer>
    </div>

    <div class="mobile-overlay-scrim" id="mobileOverlayScrim" aria-hidden="true"></div>
    <audio id="audioPlayer" preload="metadata" playsinline></audio>
    <div id="notification" class="notification" role="status" aria-live="polite"></div>
    <div id="debugInfo" class="debug-info"></div>

    <script src="js/index.js"></script>
    <script>
        if (window.__SOLARA_IS_MOBILE) {
            const mobileScript = document.createElement("script");
            mobileScript.src = "js/mobile.js";
            mobileScript.async = false;
            document.body.appendChild(mobileScript);
        }
    </script>
</body>
</html>
