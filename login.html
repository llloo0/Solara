<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>登录 - Solara</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    :root {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #edf4f1;
      background: #111817;
      font-synthesis: none;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #111817;
    }
    main { width: min(100%, 360px); }
    h1 { margin: 0 0 28px; font-size: 28px; font-weight: 650; }
    form { display: grid; gap: 14px; }
    label { color: #b9c7c1; font-size: 14px; }
    input, button {
      width: 100%;
      min-height: 48px;
      border-radius: 6px;
      font: inherit;
    }
    input {
      border: 1px solid #43514c;
      padding: 0 14px;
      color: inherit;
      background: #1b2421;
    }
    input:focus-visible {
      outline: 2px solid #55c7a7;
      outline-offset: 2px;
    }
    button {
      margin-top: 4px;
      border: 0;
      padding: 0 16px;
      color: #07130f;
      background: #69d3b2;
      font-weight: 650;
      cursor: pointer;
    }
    button:disabled { opacity: .65; cursor: wait; }
    #status {
      min-height: 22px;
      margin: 2px 0 0;
      color: #ffb1a8;
      font-size: 14px;
    }
    @media (prefers-color-scheme: light) {
      :root { color: #18201d; background: #f4f7f5; }
      body { background: #f4f7f5; }
      label { color: #52605a; }
      input { border-color: #c7d2cd; color: inherit; background: #fff; }
      #status { color: #a12f25; }
    }
  </style>
</head>
<body>
  <main>
    <form id="login-form">
      <input
        type="password"
        id="password"
        name="password"
        autocomplete="current-password"
        placeholder="请输入口令"
        required
        autofocus
      >
      <button id="submit-button" type="submit">登录</button>
      <p id="status" role="status" aria-live="polite"></p>
    </form>
  </main>
  <script>
    const form = document.getElementById("login-form");
    const passwordInput = document.getElementById("password");
    const submitButton = document.getElementById("submit-button");
    const status = document.getElementById("status");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      submitButton.disabled = true;
      submitButton.textContent = "正在登录...";
      status.textContent = "";

      try {
        const response = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "include",
          body: JSON.stringify({ password: passwordInput.value }),
        });
        if (response.ok) {
          window.location.assign("/");
          return;
        }
        status.textContent = "口令错误，请重试。";
        passwordInput.focus();
      } catch (error) {
        console.error("Login request failed:", error);
        status.textContent = "登录失败，请检查网络后重试。";
      } finally {
        submitButton.disabled = false;
        submitButton.textContent = "登录";
      }
    });
  </script>
</body>
</html>
